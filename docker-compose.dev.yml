services:
  backend:
    build:
      target: development
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules

  admin:
    build:
      target: development
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
